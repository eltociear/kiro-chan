<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiro Status Character Demo</title>
    <link rel="stylesheet" href="styles/character.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        
        .demo-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 24px;
            background: #007acc;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 12px;
            z-index: 1000;
        }
        
        .status-bar-item {
            margin-right: 12px;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        .controls button {
            margin: 5px;
            padding: 8px 16px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .controls button:hover {
            background: #1177bb;
        }
        
        .info {
            background: #2d2d30;
            padding: 16px;
            border-radius: 4px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>🎭 Kiro Status Character Demo</h1>
        
        <div class="info">
            <h3>機能説明</h3>
            <ul>
                <li>ステータスバー（画面下部）に👻キャラクターが表示されます</li>
                <li>状態に応じて異なるアニメーションを実行します</li>
                <li>アイドル: ゆっくりとした浮遊</li>
                <li>アクティブ: エネルギッシュなバウンス</li>
                <li>エラー: 振動アニメーション</li>
            </ul>
        </div>
        
        <div class="controls">
            <h3>コントロール</h3>
            <button onclick="setIdleState()">アイドル状態</button>
            <button onclick="setActiveState()">アクティブ状態</button>
            <button onclick="setErrorState()">エラー状態</button>
            <button onclick="toggleVisibility()">表示/非表示</button>
            <button onclick="changeSpeed()">速度変更</button>
        </div>
        
        <div class="info">
            <h3>現在の状態</h3>
            <p id="current-state">アイドル</p>
            <p id="current-speed">速度: 1.0x</p>
            <p id="current-visibility">表示: ON</p>
        </div>
    </div>
    
    <div class="status-bar">
        <div class="status-bar-item">Kiro IDE</div>
        <div class="status-bar-item">Ready</div>
        <span class="kiro-character visible idle">👻</span>
        <div class="status-bar-item" style="margin-left: auto;">100%</div>
    </div>

    <script>
        let currentSpeed = 1.0;
        let isVisible = true;
        let currentState = 'idle';
        
        const character = document.querySelector('.kiro-character');
        const stateDisplay = document.getElementById('current-state');
        const speedDisplay = document.getElementById('current-speed');
        const visibilityDisplay = document.getElementById('current-visibility');
        
        // Simple animation controller
        let animationFrame = null;
        let startTime = Date.now();
        
        function animate() {
            if (!isVisible) return;
            
            const elapsed = (Date.now() - startTime) * currentSpeed;
            let transform = '';
            
            switch (currentState) {
                case 'idle':
                    const idleCycle = elapsed / 2000;
                    const translateY = Math.sin(idleCycle * Math.PI * 2) * 2;
                    const rotate = Math.sin(idleCycle * Math.PI * 2) * 1;
                    transform = `translateY(${translateY}px) rotate(${rotate}deg)`;
                    break;
                    
                case 'active':
                    const activeCycle = elapsed / 1000;
                    const bounceY = Math.abs(Math.sin(activeCycle * Math.PI * 2)) * -4;
                    const scale = 1 + Math.abs(Math.sin(activeCycle * Math.PI * 2)) * 0.1;
                    transform = `translateY(${bounceY}px) scale(${scale})`;
                    break;
                    
                case 'error':
                    const intensity = Math.max(0, 1 - elapsed / 3000);
                    const shakeX = (Math.random() - 0.5) * 4 * intensity;
                    const shakeY = (Math.random() - 0.5) * 2 * intensity;
                    transform = `translateX(${shakeX}px) translateY(${shakeY}px)`;
                    break;
            }
            
            character.style.transform = transform;
            animationFrame = requestAnimationFrame(animate);
        }
        
        function setIdleState() {
            currentState = 'idle';
            character.className = 'kiro-character visible idle';
            stateDisplay.textContent = 'アイドル';
            startAnimation();
        }
        
        function setActiveState() {
            currentState = 'active';
            character.className = 'kiro-character visible active';
            stateDisplay.textContent = 'アクティブ';
            startAnimation();
        }
        
        function setErrorState() {
            currentState = 'error';
            character.className = 'kiro-character visible error';
            stateDisplay.textContent = 'エラー';
            startAnimation();
        }
        
        function toggleVisibility() {
            isVisible = !isVisible;
            if (isVisible) {
                character.classList.remove('hidden');
                character.classList.add('visible');
                startAnimation();
            } else {
                character.classList.remove('visible');
                character.classList.add('hidden');
                stopAnimation();
            }
            visibilityDisplay.textContent = `表示: ${isVisible ? 'ON' : 'OFF'}`;
        }
        
        function changeSpeed() {
            const speeds = [0.5, 1.0, 1.5, 2.0];
            const currentIndex = speeds.indexOf(currentSpeed);
            currentSpeed = speeds[(currentIndex + 1) % speeds.length];
            speedDisplay.textContent = `速度: ${currentSpeed}x`;
            startAnimation();
        }
        
        function startAnimation() {
            stopAnimation();
            startTime = Date.now();
            animationFrame = requestAnimationFrame(animate);
        }
        
        function stopAnimation() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
        }
        
        // Start initial animation
        startAnimation();
        
        // Handle reduced motion preference
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            stopAnimation();
            character.style.animation = 'none';
            character.style.transform = 'none';
        }
    </script>
</body>
</html>
